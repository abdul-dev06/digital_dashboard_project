<title>Elantra Cluster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Quicksand:wght@400;500;600&family=Michroma&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 1280x480 cluster canvas, scaled to the page width, with a small control row beneath. Single dark look on purpose (it's a dashboard at night). */
:root {
  --bg: #030405;
  --panel: #0b0e12;
  --line: #1c232b;
  --fg: #e8ecf0;
  --muted: #7d8996;
  --accent: #ff2d3f;
  --ui: "DejaVu Sans", Verdana, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--ui);
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.wrap { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.screen {
  width: 100%;
  max-width: 100%;
  aspect-ratio: 1280 / 480;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line);
  background: #000;
}
canvas { display: block; width: 100%; height: 100%; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button {
  font: inherit; font-size: 13px; letter-spacing: 0.04em;
  color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px;
  padding: 9px 14px; cursor: pointer;
}
button:hover { border-color: #2d3741; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { border-color: #3d8bff; color: #8fbcff; }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"][data-mode="eco"] { color: #2fe0a6; background: #0d1a16; }
.seg button[aria-pressed="true"][data-mode="normal"] { color: #ff5060; background: #1a0e10; }
.seg button[aria-pressed="true"][data-mode="sport"] { color: #ff7a45; background: #1c110c; }
.drive { gap: 10px; }
.tests button { font-size: 12px; padding: 7px 12px; }
.tests button[aria-pressed="true"] { border-color: #ffb020; color: #ffc65a; }
/* Kiosk view (add ?kiosk to the address): only the cluster, filling the screen, no cursor. Used on the Rock64. */
html.kiosk body { margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; cursor: none; overflow: hidden; background: #000; }
html.kiosk .wrap { max-width: none; width: min(100vw, calc(100vh * 1280 / 480)); gap: 0; }
html.kiosk .wrap > :not(.screen) { display: none; }
html.kiosk .screen { border: 0; border-radius: 0; }
.filebtn { position: relative; font-size: 13px; letter-spacing: 0.04em; color: var(--fg); background: var(--panel);
  border: 1px solid var(--line); border-radius: 8px; padding: 9px 14px; cursor: pointer; }
.filebtn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.filebtn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
.gear { min-width: 44px; text-align: center; font-size: 26px; font-weight: 300; font-variant-numeric: tabular-nums; }
.shift { min-width: 84px; }
.gas {
  flex: 1 1 220px; min-height: 64px; font-size: 15px; letter-spacing: 0.12em; text-transform: uppercase;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  background: linear-gradient(#141a21, #0c1015);
}
.gas.on { border-color: #ff5060; color: #ff7a85; box-shadow: 0 0 18px rgba(255,80,96,0.25) inset; }
@media (orientation: portrait) and (max-width: 700px) { .rotate { display: block; } }
.rotate { display: none; }
</style>

<div class="wrap">
  <div class="screen"><canvas id="cluster" width="1280" height="480" aria-label="Simulated Elantra instrument cluster"></canvas></div>
  <div class="controls">
    <button id="keyBtn" type="button">Key on</button>
    <button id="engBtn" type="button">Start engine</button>
    <label class="filebtn" for="logoIn">Use my logo
      <input id="logoIn" type="file" accept="image/*">
    </label>
    <label class="filebtn" for="logoRedIn">Redline logo
      <input id="logoRedIn" type="file" accept="image/*">
    </label>
    <label class="filebtn" for="sndStartIn">Startup sound
      <input id="sndStartIn" type="file" accept="audio/*">
    </label>
    <label class="filebtn" for="sndAlertIn">Alert sound
      <input id="sndAlertIn" type="file" accept="audio/*">
    </label>
    <span class="seg" role="group" aria-label="Drive mode">
      <button type="button" data-mode="eco" aria-pressed="false">Eco</button>
      <button type="button" data-mode="normal" aria-pressed="true">Normal</button>
      <button type="button" data-mode="sport" aria-pressed="false">Sport</button>
    </span>
  </div>
  <div class="controls drive" aria-label="Test drive">
    <button id="downBtn" type="button" class="shift">− Down</button>
    <output id="gearOut" class="gear" aria-live="polite">N</output>
    <button id="upBtn" type="button" class="shift">Up +</button>
    <button id="gasBtn" type="button" class="gas">Hold to rev</button>
    <span id="driveMsg" class="note"></span>
  </div>
  <p class="note rotate">Turn your phone sideways for a bigger view.</p>
  <div class="controls tests" aria-label="Test actions">
    <span class="note">Tests</span>
    <button type="button" id="tCold">Cold start</button>
    <button type="button" id="tHot" aria-pressed="false">Overheat</button>
    <button type="button" id="tCel" aria-pressed="false">Check engine</button>
    <button type="button" id="tFill">Filled up</button>
    <button type="button" id="tIce" aria-pressed="false">Icy outside</button>
    <button type="button" id="tLink" aria-pressed="false">OBD lost</button>
  </div>
  <p class="note" id="perf"></p>
  <p class="note">Test drive: hold the rev button (or Space), shift with the buttons or the arrow keys. It is a toy 5-speed manual just for feel; the real car will feed rpm and speed over OBD2.</p>
</div>

<script>
if (/[?&]kiosk\b/.test(location.search)) document.documentElement.classList.add("kiosk");
(() => {
  // ================= Car config =================
  // Change these and everything else follows: dial range, red zone, eco band,
  // Sport logo fade, rev limiter, sweep.
  const CFG = {
    redline: 6500,      // rpm
    idle: 760,          // rpm
    speedMax: 220,      // km/h at the end of the speedometer
    ecoBand: [0.185, 0.40],   // shift-early band, as fractions of redline
    ecoHeavy: 0.60,           // Eco economy bar: above this fraction of redline reads as heavy
    logoFullAt: 0.96,         // Sport: logo fully visible at this fraction of redline
    logoShowBelow: 1000,      // Sport: logo starts appearing this many rpm below redline (hidden below that)
    logoScale: 1.6,           // Sport: logo size over the engine
    limiterOver: 200,         // rev limiter sits this far above redline
    chargeVolts: 13.2,        // battery voltage at/above this = alternator charging (adapter AT RV reading)
    tankLitres: 55,           // fuel tank size
    afr: 14.7,                // stoichiometric air/fuel ratio for petrol
    fuelDensity: 745,         // g per litre of petrol
    defaultL100: 8.6,         // L/100 km used for range until the trip has its own average
    operatingTemp: 88,        // °C: engine counts as "cold" until it reaches this
    overheatMargin: 5,        // °C over operating temp = overheating
    coldRevFraction: 0.55,    // while cold, revving past this fraction of redline triggers a warning
    alertSeconds: 7,          // how long a warning note stays on screen
    traceSeconds: 24,         // Sport rev trace: seconds of history shown
    traceHz: 10,              // rev trace / shift detection sample rate (matches realistic OBD rate)
    shiftStep: 0.18,          // rpm/speed ratio must change by this much to count as a shift
    shiftMinSpeed: 10,        // km/h: below this the ratio isn't trusted (converter slip)
    roadPxPerKmh: 1.6,        // lane-line scroll speed under the car
    offRpm: 50,               // below this the engine is off (key on, engine off)
    runRpm: 400,              // above this the engine is running; between the two it is cranking
    coldLampOff: 50,          // °C: blue coolant lamp goes out above this
    lowVolts: 12.2,           // running below this for 5 s = charging fault (battery lamp + alert)
    lowFuel: 0.12,            // fuel lamp at/below this fraction of the tank
    iceTemp: 3                // °C: ice warning lamp at/below this outside temperature
  };
  const REDLINE = CFG.redline;
  const MAXRPM = Math.ceil(REDLINE / 1000 + 1) * 1000;   // dial runs at least 1000 rpm past redline
  const LIMIT = REDLINE + CFG.limiterOver;
  const OP_TEMP = CFG.operatingTemp, HOT_TEMP = OP_TEMP + CFG.overheatMargin;
  const COLD_REV = REDLINE * CFG.coldRevFraction;
  const COOLANT_MIN = 40, COOLANT_MAX = HOT_TEMP + 25;        // coolant ring range

  // ================= Static design state =================
  // Fixed example values to design against. Only the key-on sweep animates.
  // Live values. In the car each comes from the source noted in DESIGN.md (OBD2 PID,
  // adapter command or calculation); here the toy drivetrain and test buttons fill them in.
  const VIEW = {
    speed: 0, rpm: CFG.idle,
    coolant: 89, intakeTemp: 21, outsideTemp: 7, maf: 2.4, batteryVolts: 12.9,
    engineLoad: 16, throttle: 7, timing: 6.5, lambda: 1.0, cat1: 420, cat2: 360,
    fuel: 0.58, tripA: 148.7, tripB: 1204.3, tripTime: 0, tripDist: 0,
    tripFuel: 0, lph: 0, l100: null, avgL100: null, range: 0
  };
  const S = Object.assign({}, VIEW, {
    leftTurn: false, rightTurn: false, checkEngine: false, obdLink: true
  });

  // ================= Power-on sequence =================
  // 1. black, logo fades in and out
  // 2. both dials fade in side by side and sweep
  // 3. dials glide into place while the rest of the dash fades in
  // 4. bulb check on the warning lamps, small rings sweep, needles settle at 0 (engine off)
  // The engine is started separately; see ENGINE below.
  const T = {
    logoIn: [0.25, 1.25], logoOut: [2.0, 2.6],
    gaugesIn: [2.35, 3.05], sweep: [3.0, 4.4],
    move: [4.5, 5.45], dashIn: [4.75, 5.8],
    lamps: [4.75, 6.5], settle: [5.4, 6.15],
    miniUp: [5.55, 6.2], miniDown: [6.2, 6.85],
    end: 6.9
  };
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, [a, b]) => clamp01((t - a) / (b - a));
  const smooth = x => x * x * (3 - 2 * x);
  const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
  const easeOut = x => 1 - Math.pow(1 - x, 3);
  const lerp = (a, b, k) => a + (b - a) * k;

  // Where the dials sit during the intro (side by side, slightly smaller)
  const INTRO = { tach: { x: 776, y: 240, s: 0.82 }, speed: { x: 454, y: 240, s: 0.82 } };
  const FINAL = { tach: { x: 640, y: 212, s: 1 },    speed: { x: 322, y: 262, s: 1 } };
  const ECO_POSE = { tach: { x: 640, y: 212, s: 0.9 }, speed: { x: 640, y: 212, s: 1.47 } };   // speedo grows into the centre

  const A = { logo: 0, logoScale: 1, gauges: 0, dash: 0, move: 0, lamps: false, miniUp: 0, miniDown: 0 };

  // Returns true while still animating.
  function animate(t) {
    // logo
    const li = easeOut(seg(t, T.logoIn)), lo = smooth(seg(t, T.logoOut));
    A.logo = li * (1 - lo);
    A.logoScale = lerp(0.94, 1, li) + 0.04 * lo;

    // dials
    A.gauges = smooth(seg(t, T.gaugesIn));
    const sp = seg(t, T.sweep);
    const s = smooth(sp < 0.5 ? sp * 2 : (1 - sp) * 2);
    A.move = easeInOut(seg(t, T.move));
    const st = easeInOut(seg(t, T.settle));
    S.realSpeed = VIEW.speed;
    if (t < T.sweep[1]) { S.rpm = MAXRPM * s; S.speed = CFG.speedMax * s; }
    else { S.rpm = D.rpm * st; S.speed = D.speed * st; }     // key on: engine still off, so it settles at 0

    // dash
    A.dash = smooth(seg(t, T.dashIn));
    A.lamps = t >= T.lamps[0] && t < T.lamps[1];
    A.miniUp = smooth(seg(t, T.miniUp));
    A.miniDown = smooth(seg(t, T.miniDown));
    return t < T.end;
  }

  // ================= Drawing =================
  // Layout: the RPM dial sits in the middle and everything else wraps around it.
  // Both side panels have a concave inner edge cut on the dial's own circle, the
  // bottom band dips under the dial the same way, and cards overlap the panels.
  const cv = document.getElementById("cluster");
  let ctx = cv.getContext("2d");
  const W = 1280, H = 480;
  const FONT = '"DejaVu Sans", Verdana, "Segoe UI", system-ui, sans-serif';
  const RED = "#ff2d3f";

  // ================= Drive modes =================
  // Normal is the base design. Eco calms everything down to mint and adds a
  // shift-early band on the tach. Sport warms it to orange-red and adds shift
  // lights inside the tach. The car always powers on in Normal.
  const THEMES = {
    normal: { car: "#7fb4ff", accent: "#ff2d3f", tick: "#f2f4f7", needle: "#ff5060", panelTop: "#0d1116", redband: "#d1162b", label: "NORMAL" },
    eco:    { car: "#5ff0c0", accent: "#2fe0a6", tick: "#e3fff4", needle: "#3cf0b4", panelTop: "#0a1513", redband: "#5a1a22", label: "ECO" },
    sport:  { car: "#ff7a3d", accent: "#ff5a1f", tick: "#fff0e6", needle: "#ff3b1f", panelTop: "#170d0c", redband: "#ff1f3a", label: "SPORT" }
  };
  // Gauge numerals per mode: family, weights (dial / scale / hub), size factor
  const NUMFONTS = {
    normal: { family: "'Rajdhani', 'DejaVu Sans', sans-serif",  dial: 600, scale: 600, hub: 700, size: 1.12 },
    eco:    { family: "'Quicksand', 'DejaVu Sans', sans-serif", dial: 500, scale: 600, hub: 600, size: 1.0 },
    sport:  { family: "'Michroma', 'DejaVu Sans', sans-serif",  dial: 400, scale: 400, hub: 400, size: 0.78 }
  };
  // swap at the midpoint of a mode change, while the colours are mid-fade
  // During a mode change both faces are drawn, old fading out and new fading in.
  function withNumFonts(fn) {
    const k = smooth(modeK);
    if (k >= 1 || MODE.from === MODE.to) { fn(NUMFONTS[MODE.to]); return; }
    for (const [m, a] of [[MODE.from, 1 - k], [MODE.to, k]]) {
      ctx.save(); ctx.globalAlpha *= a; fn(NUMFONTS[m]); ctx.restore();
    }
  }
  const hexRgb = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const mixHex = (a, b, k) => { const x = hexRgb(a), y = hexRgb(b);
    return "#" + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, "0")).join(""); };
  const rgba = (h, a) => { const [r, g, b] = hexRgb(h); return `rgba(${r},${g},${b},${a})`; };
  const MODE = { from: "normal", to: "normal", t0: -1e9, dur: 0.6 };
  // Switching to/from Sport: the outgoing layout eases away (Normal/Eco zoom slightly toward you,
  // Sport's brackets slide out to the sides and the engine shrinks), then the incoming one arrives
  // the opposite way. Only transforms + alpha on cached images, so it costs about one extra blit.
  const SPORT_SWITCH = { dur: 0.85, outEnd: 0.65, inStart: 0.25, slide: 90, zoom: 0.08, engineFrom: 0.82 };
  const SPX = { active: false, sport: 0, other: 1, off: 0, eng: 1, zoom: 1 };
  function sportTransition() {
    const toS = MODE.to === "sport", fromS = MODE.from === "sport";
    if (toS === fromS || modeK >= 1) return Object.assign(SPX, { active: false, sport: toS ? 1 : 0, other: toS ? 0 : 1, off: 0, eng: 1, zoom: 1 });
    const C = SPORT_SWITCH, p = modeK;
    const outP = Math.max(0, Math.min(1, p / C.outEnd)), inP = Math.max(0, Math.min(1, (p - C.inStart) / (1 - C.inStart)));
    const outA = 1 - smooth(outP), inA = smooth(inP);
    const away = outP * outP, arrive = 1 - (1 - Math.pow(1 - inP, 3));     // leave accelerating, arrive decelerating
    if (toS) return Object.assign(SPX, { active: true, sport: inA, other: outA, off: C.slide * arrive, eng: lerp(1, C.engineFrom, arrive), zoom: 1 + C.zoom * away });
    return Object.assign(SPX, { active: true, sport: outA, other: inA, off: C.slide * away, eng: lerp(1, C.engineFrom, away), zoom: 1 + C.zoom * arrive });
  }
  let TH = Object.assign({}, THEMES.normal), modeK = 1, ecoA = 0, sportA = 0, MT = 1e9;
  const into = (m, d) => MODE.to === m ? 1 - Math.pow(1 - Math.max(0, Math.min(1, MT / d)), 3) : 1;   // eased 0..1 entering mode m
  function updateTheme(now) {
    modeK = Math.min(1, (now - MODE.t0) / MODE.dur);
    const k = modeK * modeK * (3 - 2 * modeK);
    const a = THEMES[MODE.from], b = THEMES[MODE.to];
    for (const key of ["car", "accent", "tick", "needle", "panelTop", "redband"]) TH[key] = mixHex(a[key], b[key], k);
    const amt = m => (MODE.from === m ? 1 - k : 0) + (MODE.to === m ? k : 0);
    sportTransition();
    // during a switch to/from Sport the other layout keeps its own shape and just leaves/arrives as a whole
    ecoA = SPX.active ? ((MODE.from === "eco" || MODE.to === "eco") ? 1 : 0) : amt("eco");
    sportA = SPX.sport;
    MT = now - MODE.t0;
    return modeK < 1 || MT < 2.9;
  }

  // Dial + wrap geometry
  const DCX = 640, DCY = 212, DR = 194;
  const WRAP = 214;                       // radius of the cut-outs around the dial
  const PT = 34, PB = 404;                // side panel top / bottom (content coordinates)
  const PANEL_OUT = 52;                   // outer edge of the side panels
  const BT = 446, BB = 474;               // bottom strip top / bottom (screen coordinates): just fits the lamps
  // Everything above the strip is drawn 8% larger to fill the space the slim strip frees up.
  const GS = 1.08, G_TOP = 8, G_SRC_TOP = 14;
  function enterGroup() { ctx.translate(W / 2, G_TOP); ctx.scale(GS, GS); ctx.translate(-W / 2, -G_SRC_TOP); }
  const ang = v => 180 + 250 * Math.max(0, Math.min(1, v / MAXRPM));
  const toRad = a => (a - 90) * Math.PI / 180;
  const wrapX = y => Math.sqrt(Math.max(0, WRAP * WRAP - (y - DCY) * (y - DCY)));   // half-width of the cut at y

  function fitCanvas() {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = cv.clientWidth || W;
    const scale = (w / W) * dpr;
    cv.width = Math.round(W * scale);
    cv.height = Math.round(H * scale);
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    curScale = scale;
  }

  function rrect(x, y, w, h, r) {
    r = Math.min(r, h / 2, w / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function text(str, x, y, size, color, opts = {}) {
    ctx.font = `${opts.weight || 400} ${size}px ${opts.family || FONT}`;
    ctx.fillStyle = color;
    ctx.textAlign = opts.align || "left";
    ctx.textBaseline = opts.base || "top";
    if ("letterSpacing" in ctx) ctx.letterSpacing = (opts.ls || 0) + "px";
    ctx.fillText(String(str), x, y);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
  }
  function measure(str, size, weight = 400, ls = 0, family = FONT) {
    ctx.font = `${weight} ${size}px ${family}`;
    if ("letterSpacing" in ctx) ctx.letterSpacing = ls + "px";
    const w = ctx.measureText(String(str)).width;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    return w;
  }
  // 1234.56 -> "1,234.6" (by hand: Qt's JavaScript ignores toLocaleString's options)
  const fmtNum = (v, digits = 0) => { const [i, f] = v.toFixed(digits).split("."); return i.replace(/\B(?=(\d{3})+(?!\d))/g, ",") + (f ? "." + f : ""); };
  const fmtTime = s => { const m = Math.floor(s / 60), h = Math.floor(m / 60), mm = m % 60; return h + ":" + (mm < 10 ? "0" : "") + mm; };

  // ---- Shapes ----
  // Left panel: bulging outer edge, concave inner edge on the dial circle.
  // mirror = true builds the right panel.
  function sidePanelPath(mirror) {
    const X = x => mirror ? W - x : x;
    const topIn = DCX - wrapX(PT), botIn = DCX - wrapX(PB);
    const aTop = Math.atan2(PT - DCY, topIn - DCX), aBot = Math.atan2(PB - DCY, botIn - DCX);
    ctx.beginPath();
    ctx.moveTo(X(124), PT);
    ctx.lineTo(X(topIn - 6), PT);
    ctx.quadraticCurveTo(X(topIn), PT, X(topIn + 1), PT + 2);
    if (!mirror) ctx.arc(DCX, DCY, WRAP, aTop, aBot, true);
    else ctx.arc(DCX, DCY, WRAP, Math.PI - aTop, Math.PI - aBot, false);
    ctx.quadraticCurveTo(X(botIn - 4), PB, X(botIn - 14), PB);
    ctx.lineTo(X(96), PB);
    ctx.bezierCurveTo(X(PANEL_OUT + 22), PB, X(PANEL_OUT), 330, X(PANEL_OUT), 240);
    ctx.bezierCurveTo(X(PANEL_OUT), 120, X(PANEL_OUT + 22), PT, X(124), PT);
    ctx.closePath();
  }
  function bandPath() {                   // slim pill across the bottom
    rrect(22, BT, W - 44, BB - BT, (BB - BT) / 2);
  }

  function fillPanel(pathFn, top, bottom) {
    const g = ctx.createLinearGradient(0, top, 0, bottom);
    g.addColorStop(0, TH.panelTop); g.addColorStop(1, "#07090c");
    ctx.fillStyle = g; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = "#1d252e"; ctx.stroke();
  }
  // Rock64-friendly glow: two wide see-through strokes under the core line.
  // No blur filter, so it costs about the same as three plain lines.
  function glowStroke(color, width, blur) {
    ctx.save();
    const a0 = ctx.globalAlpha;
    ctx.strokeStyle = color;
    ctx.globalAlpha = a0 * 0.10; ctx.lineWidth = width + blur * 1.3; ctx.stroke();
    ctx.globalAlpha = a0 * 0.22; ctx.lineWidth = width + blur * 0.55; ctx.stroke();
    ctx.globalAlpha = a0; ctx.lineWidth = width; ctx.stroke();
    ctx.restore();
  }


  // Car top view: one pre-drawn image per drive mode (plain images in Qt).

  function traceUpdate(dt) {
    traceT += dt; traceAcc += dt;
    crank += 2 * Math.PI * (S.rpm / 60) * dt * 0.06;        // slowed ~16x so the motion is readable
    flowZ += (10 + S.rpm / 60) * dt;
    bayUpdate(dt);                                            // engine heat
    const step = 1 / CFG.traceHz;
    while (traceAcc >= step) {
      traceAcc -= step;
      traceBuf.push({ t: traceT, rpm: S.rpm, v: S.realSpeed || 0 });
      const keep = CFG.traceSeconds * CFG.traceHz + 2;

    const now = traceBuf[n - 1], prev = traceBuf[n - 1 - lag - hold];

  // ---- live ----
  let engHeat = 0;
  function bayUpdate(dt) {
    const k = Math.max(0, Math.min(1, (S.rpm - CFG.idle) / (REDLINE - CFG.idle)));
    engHeat += (k - engHeat) * Math.min(1, dt / 1.5);         // the engine heats and cools slowly
  }
  function drawBayLive() {
    const E = ENG, now = performance.now() / 1000;
    ctx.save(); ctx.translate(E.cx, E.pose.y); ctx.scale(E.pose.s, E.pose.s); ctx.translate(-E.cx, -230);
    const h = smooth(engHeat), hot = mixHex(BAYC, "#ff1f2a", h);
    // engine heat: head, block and cover warm toward red; outline glows when hot
    if (h > 0.01) {
      ctx.fillStyle = rgba(hot, 0.32 * h);
      rrect(E.head.x, E.head.y, E.head.w, E.head.h, 5); ctx.fill();
      poly(E.block)(); ctx.fill();
      timingPath(); ctx.fill();
      poly(E.block)(); glowStroke(rgba(hot, 0.9 * h), 1.6, 7);
      timingPath(); glowStroke(rgba(hot, 0.9 * h), 1.4, 6);
    }
    // pulleys: each turns at crank speed × crank/pulley diameter ratio, like the real belt drive
    const pulley = (p, col, spokes, ring) => {
      const ang = crank * E.pul.crank.r / p.r;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fillStyle = GLASS; ctx.fill();
      ctx.lineWidth = 1.5; ctx.strokeStyle = col; ctx.stroke();

      ctx.beginPath();
      for (let k = 0; k < spokes; k++) { const a = ang + k * 2 * Math.PI / spokes; ctx.moveTo(p.x + Math.cos(a) * 2.5, p.y + Math.sin(a) * 2.5); ctx.lineTo(p.x + Math.cos(a) * (p.r - (ring ? 5 : 2)), p.y + Math.sin(a) * (p.r - (ring ? 5 : 2))); }
      ctx.lineWidth = 1.2; ctx.stroke();
      ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI * 2); ctx.fillStyle = col; ctx.fill();
    };

    pulley(E.pul.ac, BAYC, 3, true);
    pulley(E.pul.ps, BAYC, 4, false);
    pulley(E.pul.idler, BAYC, 3, false);
    pulley(E.pul.alt, mixHex(BAYC, "#5ee08a", smooth(chargeK)), 5, false);
    // readouts
    const L = 516, R = 752, v = (s, x, y, al, col) => text(s, x, y, 12, col || "#f2f4f7", { align: al, base: "middle", weight: 500 });
    v(Math.round(S.intakeTemp) + "°C", L, 198, "right");
    v(Math.round(S.engineLoad) + "%", R, 228, "left");
    v(S.timing.toFixed(0) + "°", R, 264, "left");

    if (shiftFlash && now - shiftFlash.t < 0.9) {
      const a = 1 - (now - shiftFlash.t) / 0.9, x = R + 10, y = 300;
      ctx.save(); ctx.globalAlpha *= a; ctx.beginPath();
      if (shiftFlash.up) { ctx.moveTo(x, y - 7); ctx.lineTo(x + 7, y + 5); ctx.lineTo(x - 7, y + 5); }
      else { ctx.moveTo(x, y + 7); ctx.lineTo(x + 7, y - 5); ctx.lineTo(x - 7, y - 5); }
      ctx.closePath(); ctx.fillStyle = shiftFlash.up ? "#ffffff" : "#ffb020"; ctx.fill();
      text("SHIFT", x, y + 15, 7, "#c9b2a6", { align: "center", base: "middle", ls: 1 }); ctx.restore();
    }
  ctx.restore();
  }

  // Normal: the road scene in the right panel, with charging and engine-temp lines under the title
  function drawNormalVehicle() {
    const t = S.coolant;
    const cold = Math.max(0, Math.min(1, (OP_TEMP - t) / 40)), hot = Math.max(0, Math.min(1, (t - HOT_TEMP) / 8));
    const pulse = hot > 0 ? 0.7 + 0.3 * Math.sin(performance.now() / 1000 * 6) : 1;
    drawRoadLive(NROAD, "normal", hot > 0 ? hot * pulse : -cold);
    drawChargeRow(NROAD.cx, 84);
    const msg = cold > 0 ? ["WARMING UP", "#6fa8ff"] : hot > 0 ? ["ENGINE HOT", "#ff2d3f"] : null;
    if (msg) text(msg[0], NROAD.cx, 102, 9, msg[1], { align: "center", base: "middle", ls: 2 });
  }

  function placed(which) {
    const a = INTRO[which], f = FINAL[which], e = ECO_POSE[which], k = ecoA;
    const b = { x: lerp(f.x, e.x, k), y: lerp(f.y, e.y, k), s: lerp(f.s, e.s, k) };

  // ================= Bottom strip: wire floor + warning lamps =================
  // A perspective grid floor across the bottom (cached in each mode's chrome), and the
  // warning lamps the car can actually give over OBD2, standing on it.
  const FLOOR = { top: 438, bottom: 480, vpY: 415, step: 64, rows: 5 };
  function drawFloor() {
    const F = FLOOR, cx = W / 2, uN = F.bottom - F.vpY, uF = F.top - F.vpY;
    const base = ctx.createLinearGradient(0, F.top, 0, F.bottom);
    base.addColorStop(0, rgba(TH.accent, 0)); base.addColorStop(1, rgba(TH.accent, 0.08));
    ctx.fillStyle = base; ctx.fillRect(0, F.top, W, F.bottom - F.top);
    const sideFade = a => {
      const g = ctx.createLinearGradient(0, 0, W, 0);
      g.addColorStop(0, rgba(TH.accent, 0)); g.addColorStop(0.18, rgba(TH.accent, a));
      g.addColorStop(0.82, rgba(TH.accent, a)); g.addColorStop(1, rgba(TH.accent, 0));
      return g;
    };
    ctx.save(); ctx.beginPath(); ctx.rect(0, F.top, W, F.bottom - F.top); ctx.clip();
    ctx.lineWidth = 1;
    // cross lines, evenly spaced in depth (1/distance) so they bunch up toward the far edge
    for (let i = 1; i <= F.rows; i++) {
      const t = i / F.rows, y = F.vpY + 1 / lerp(1 / uF, 1 / uN, t);
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.strokeStyle = sideFade(0.08 + 0.26 * t); ctx.stroke();
    }
    // lines running away from the viewer toward a vanishing point just above the far edge
    const vg = ctx.createLinearGradient(0, F.top, 0, F.bottom);
    vg.addColorStop(0, rgba(TH.accent, 0.05)); vg.addColorStop(1, rgba(TH.accent, 0.42));
    const n = Math.ceil(cx / F.step) + 6;
    for (let k = -n; k <= n; k++) {
      const xb = cx + k * F.step, xt = cx + (xb - cx) * uF / uN;
      const edge = Math.max(0, 1 - Math.abs(xb - cx) / (cx * 1.3));
      if (edge <= 0) continue;
      ctx.globalAlpha = edge;
      ctx.beginPath(); ctx.moveTo(xt, F.top); ctx.lineTo(xb, F.bottom); ctx.strokeStyle = vg; ctx.stroke();
    }
    ctx.restore();
    // far edge: a glowing line like the accent lines up top, fading out at the ends
    const hg = ctx.createLinearGradient(0, 0, W, 0);
    hg.addColorStop(0, rgba(TH.accent, 0)); hg.addColorStop(0.2, rgba(TH.accent, 0.75));
    hg.addColorStop(0.8, rgba(TH.accent, 0.75)); hg.addColorStop(1, rgba(TH.accent, 0));
    ctx.beginPath(); ctx.moveTo(20, F.top); ctx.lineTo(W - 20, F.top); glowStroke(hg, 1.5, 6);
  }

      for (const y of [5.5, 8.5, 11.5]) { P([[14.5, y], [17, y]]); c.stroke(); }
      c.lineWidth = 1.5; c.beginPath(); c.moveTo(2.5, 21.5);
      for (let x = 2.5; x < 21; x += 4.5) { c.quadraticCurveTo(x + 1.1, 20, x + 2.25, 21.5); c.quadraticCurveTo(x + 3.4, 23, x + 4.5, 21.5); }

      rrect(4, 4, 10, 17, 1.5); c.fill(); c.stroke();
